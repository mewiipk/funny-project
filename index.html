<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Budget Buddy</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <header>
        <h1>Budget Buddy</h1>
        <p>Track your monthly budget, income, and expenses in one place.</p>
      </header>

      <section class="card">
        <h2>Monthly Plan</h2>
        <form id="budget-form" class="grid-form">
          <label>
            Month
            <input id="month" type="month" required />
          </label>
          <label>
            Budget Goal ($)
            <input id="budget-goal" type="number" min="0" step="0.01" required />
          </label>
          <button type="submit">Save Monthly Budget</button>
        </form>
      </section>

      <section class="stats-grid" aria-live="polite">
        <article class="stat card">
          <h3>Income</h3>
          <p id="income-total">$0.00</p>
        </article>
        <article class="stat card">
          <h3>Expenses</h3>
          <p id="expense-total">$0.00</p>
        </article>
        <article class="stat card">
          <h3>Remaining</h3>
          <p id="remaining-total">$0.00</p>
        </article>
        <article class="stat card">
          <h3>Goal Progress</h3>
          <p id="progress-total">0%</p>
          <div class="progress-track"><div id="progress-bar" class="progress-bar"></div></div>
        </article>
      </section>

      <section class="card">
        <h2>Add Transaction</h2>
        <form id="transaction-form" class="grid-form">
          <label>
            Type
            <select id="type" required>
              <option value="expense">Expense</option>
              <option value="income">Income</option>
            </select>
          </label>
          <label>
            Category
            <input id="category" type="text" placeholder="Groceries, Salary..." required />
          </label>
          <label>
            Date
            <input id="date" type="date" required />
          </label>
          <label>
            Amount ($)
            <input id="amount" type="number" min="0.01" step="0.01" required />
          </label>
          <label class="full-width">
            Notes
            <input id="notes" type="text" placeholder="Optional" />
          </label>
          <button type="submit">Add Transaction</button>
        </form>
      </section>

      <section class="card">
        <div class="section-title">
          <h2>Transactions</h2>
          <button id="clear-data" class="danger" type="button">Clear All Data</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Date</th>
                <th>Type</th>
                <th>Category</th>
                <th>Notes</th>
                <th>Amount</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="transaction-table"></tbody>
          </table>
        </div>
      </section>

      <section class="card">
        <h2>Expenses by Category</h2>
        <ul id="category-list" class="category-list"></ul>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
